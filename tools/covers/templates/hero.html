<!doctype html>
<meta charset="utf-8">
<!-- The picture does the work. Use an image with calm space at the top: the title
     sits there in dark ink, so nothing covers the subject. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; }
  body { position: relative; background: #e9e4dc; font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; }
  img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  h1 { position: absolute; left: 76px; right: 76px; top: 92px; max-height: 340px; overflow: hidden; color: #2b2622; font-size: 88px; line-height: 1.26; font-weight: 600; letter-spacing: -.005em; }
  em { font-style: normal; color: #a8522f; }
</style>
<img src="{{image}}" alt="">
<h1 data-fit="title">{{title}}</h1>
