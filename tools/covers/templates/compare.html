<!doctype html>
<meta charset="utf-8">
<!-- Before and after: two real images at equal weight, labels kept out of the way. -->
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1440px; overflow: hidden; }
  body { background: #f6f2ea; color: #2a2622; font-family: "PingFang SC", "Hiragino Sans GB", sans-serif; padding: 72px 64px 64px; display: flex; flex-direction: column; gap: 28px; }
  h1 { font-size: 66px; line-height: 1.26; font-weight: 600; max-height: 170px; overflow: hidden; }
  em { font-style: normal; color: #c2553b; }
  figure { position: relative; flex: 1; min-height: 0; border-radius: 16px; overflow: hidden; background: #e9e3d7; }
  img { width: 100%; height: 100%; object-fit: cover; display: block; }
  figcaption { position: absolute; left: 20px; bottom: 20px; padding: 8px 18px; border-radius: 8px; background: rgba(255, 252, 245, .92); font-size: 32px; font-weight: 500; }
</style>
<h1 data-fit="title">{{title}}</h1>
<figure><img src="{{image_a}}" alt=""><figcaption>{{label_a}}</figcaption></figure>
<figure><img src="{{image_b}}" alt=""><figcaption>{{label_b}}</figcaption></figure>
