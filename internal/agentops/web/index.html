<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拼豆工坊 · 运营工作台</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="运营工作台首页"><span class="brand-icon">◈</span><span>Omni <strong>Agents</strong></span></a>
      <div class="workspace"><span class="workspace-icon">▦</span><div><strong id="product-name">拼豆工坊</strong><small>跨平台运营 · 操作由你确认</small></div></div>
      <div class="nav-label">工作空间</div>
      <nav id="nav" aria-label="主导航"></nav>
      <div class="sidebar-bottom"><span class="live-dot"></span> 本地运营工作台<small>角色与规则持续保存</small></div>
    </aside>
    <main>
      <header class="topbar"><div id="breadcrumb">工作空间 / 概览</div><div class="top-actions"><span id="model-status" class="pill">正在连接工作台</span><button id="run-button" class="button primary">准备下一轮</button></div></header>
      <div id="content" class="content" aria-live="polite"><div class="empty">正在读取运营内容…</div></div>
    </main>
  </div>
  <dialog id="dialog"><div class="dialog-header"><h2 id="dialog-title"></h2><button id="dialog-close" class="icon-button" aria-label="关闭">×</button></div><div id="dialog-body"></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
