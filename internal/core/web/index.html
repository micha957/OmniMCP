<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OmniMCP 控制台</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8edf5;background:#0b1020;line-height:1.5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 500px at 80% -10%,#263a70 0,transparent 60%),#0b1020}.shell{display:flex;min-height:100vh}.side{width:248px;padding:28px 18px;border-right:1px solid #202a42;background:#10172a}.brand{font-weight:800;font-size:21px;letter-spacing:-.5px;padding:0 12px 32px}.brand span{color:#6e9cff}.nav{display:grid;gap:7px}.nav button{border:0;background:none;color:#8491ad;text-align:left;padding:12px 14px;border-radius:10px;font-size:14px;cursor:pointer}.nav button.active,.nav button:hover{background:#1c2947;color:#fff}.main{flex:1;max-width:1280px;padding:34px 42px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}.eyebrow{font-size:12px;color:#7890be;text-transform:uppercase;letter-spacing:1.5px}.title{font-size:30px;font-weight:750;margin:5px 0}.sub{color:#8390ab;font-size:14px}.status{display:flex;align-items:center;gap:9px;color:#9daac2;font-size:13px}.dot{width:9px;height:9px;border-radius:99px;background:#46d39a;box-shadow:0 0 14px #46d39a}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:28px}.card{background:rgba(20,29,51,.86);border:1px solid #273452;border-radius:15px;padding:20px}.metric{font-size:28px;font-weight:750;margin-top:8px}.muted{color:#8794af;font-size:13px}.section{display:flex;align-items:center;justify-content:space-between;margin:28px 0 14px}.section h2{font-size:17px;margin:0}.button{border:0;border-radius:9px;padding:10px 15px;background:#668cff;color:#fff;font-weight:650;cursor:pointer}.button:hover{background:#7b9cff}.button.ghost{background:#1c2945;color:#b6c4e3}.button.danger{background:#49243a;color:#ff9ebe}.plugins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.plugin-head,.row{display:flex;align-items:center;justify-content:space-between}.icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;margin-right:12px}.xhs{background:#ff3b61}.wx{background:#1ec27a}.bili{background:#27b8e8}.tag{font-size:11px;padding:4px 8px;border-radius:99px;background:#1b5949;color:#8ef0bd}.tag.off{background:#3b314b;color:#c0b3d7}.plugin-name{font-weight:700}.plugin-meta{margin-top:16px;color:#8693ac;font-size:13px}.accounts{background:#111a2e;border:1px solid #273452;border-radius:15px;overflow:hidden}.row{padding:16px 20px;border-bottom:1px solid #202c46}.row:last-child{border-bottom:0}.acct{display:flex;align-items:center;gap:12px}.avatar{width:36px;height:36px;border-radius:11px;background:#27375d;display:grid;place-items:center;font-weight:800;color:#adc2ff}.actions{display:flex;gap:8px}.empty{padding:34px;text-align:center;color:#8190ae}.modal{position:fixed;inset:0;background:#050914aa;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.dialog{width:min(480px,100%);background:#141e35;border:1px solid #314363;border-radius:17px;padding:24px;box-shadow:0 20px 80px #0008}.dialog h3{margin:0 0 18px}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:12px;color:#96a5c2}.field input,.field select{width:100%;border:1px solid #344565;background:#0e1628;color:#eef3ff;border-radius:9px;padding:11px 12px;outline:none}.field input:focus{border-color:#7596ff}.dialog-foot{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.hint{font-size:12px;color:#8794af;margin-top:10px}.toast{position:fixed;right:24px;bottom:24px;background:#243456;color:#fff;padding:12px 16px;border-radius:10px;display:none}.toast.show{display:block}@media(max-width:900px){.side{width:190px}.main{padding:25px}.grid,.plugins{grid-template-columns:1fr}.top{align-items:flex-start;gap:20px;flex-direction:column}}
</style></head><body><div class="shell"><aside class="side"><div class="brand"><span>◈</span> OmniMCP</div><div class="nav"><button class="active">概览</button><button onclick="location.href='/approvals'">待确认操作</button><button onclick="document.querySelector('#accounts').scrollIntoView({behavior:'smooth'})">账号管理</button><button onclick="document.querySelector('#plugins').scrollIntoView({behavior:'smooth'})">插件中心</button></div></aside><main class="main"><div class="top"><div><div class="eyebrow">LOCAL CONTROL PLANE</div><div class="title">工作台</div><div class="sub">统一管理平台插件、账号会话和 MCP 能力</div></div><div class="status"><i class="dot"></i> MCP 服务运行中</div></div><div class="grid"><div class="card"><div class="muted">已接入平台</div><div class="metric" id="platformCount">—</div><div class="muted">可独立启停插件</div></div><div class="card"><div class="muted">账号会话</div><div class="metric" id="accountCount">—</div><div class="muted">凭据按账号隔离</div></div><div class="card"><div class="muted">已注册工具</div><div class="metric" id="toolCount">—</div><div class="muted">自动暴露到 MCP</div></div></div><div class="section" id="plugins"><h2>插件中心</h2></div><div class="plugins" id="pluginList"></div><div class="section" id="accounts"><div><h2>账号管理</h2><div class="muted">每个平台的登录态和凭据互相隔离</div></div><button class="button" onclick="openModal()">＋ 添加账号</button></div><div class="accounts" id="accountList"></div><div class="section" id="tools"><div><h2>工具测试台</h2><div class="muted">直接调用真实 MCP 工具，返回结果与 MCP 客户端一致</div></div></div><div class="card"><div class="field"><label>工具</label><select id="toolSelect" onchange="toolChanged()"></select></div><div class="muted" id="toolDescription"></div><div class="field"><label>参数 JSON</label><textarea id="toolArgs" rows="7" style="width:100%;border:1px solid #344565;background:#0e1628;color:#eef3ff;border-radius:9px;padding:11px 12px;font:13px ui-monospace,monospace;resize:vertical">{}</textarea></div><button class="button" onclick="runTool()">▶ 调用工具</button><pre id="toolResult" style="white-space:pre-wrap;background:#0b1222;border-radius:9px;padding:14px;margin:16px 0 0;color:#a9b9d7;min-height:60px;overflow:auto">等待调用…</pre></div></main></div><div class="modal" id="modal"><div class="dialog"><h3>添加平台账号</h3><div class="field"><label>平台</label><select id="plugin"><option value="xiaohongshu">小红书 · 浏览器登录</option><option value="wechat">微信公众号 · AppID</option><option value="bilibili">哔哩哔哩 · Cookie</option></select></div><div class="field"><label>账号标识</label><input id="account" placeholder="例如 main、marketing"></div><div class="field" id="secretFields"></div><div class="hint" id="formHint">保存后点击“打开登录”，在独立浏览器窗口完成登录。</div><div class="dialog-foot"><button class="button ghost" onclick="closeModal()">取消</button><button class="button" onclick="saveAccount()">保存账号</button></div></div></div><div class="toast" id="toast"></div><script>
let plugins=[],tools=[];const $=id=>document.getElementById(id);function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}function openModal(){$('modal').classList.add('open');renderFields()}function closeModal(){$('modal').classList.remove('open')}$('plugin').onchange=renderFields;function renderFields(){let p=$('plugin').value;if(p==='wechat'){$('secretFields').innerHTML='<label>AppID</label><input id="app_id" placeholder="wx..."/><label>AppSecret</label><input id="app_secret" type="password" placeholder="公众号 AppSecret"/>';$('formHint').textContent='凭据只保存在本机 data/accounts.json，文件权限为 600。'}else if(p==='bilibili'){$('secretFields').innerHTML='<label>Cookie（可选，发表评论时需要）</label><input id="cookie" placeholder="SESSDATA=...; bili_jct=..."/>';$('formHint').textContent='公开读取能力无需 Cookie；发表评论需要包含 bili_jct。'}else{$('secretFields').innerHTML='';$('formHint').textContent='保存后点击“打开登录”，在独立浏览器窗口完成登录。'}}async function api(url,opt){let r=await fetch(url,opt);if(!r.ok)throw new Error(await r.text());return r.json()}function toolChanged(){let t=tools.find(x=>x.name===$('toolSelect').value);if(!t)return;$('toolDescription').textContent=t.description;$('toolArgs').value='{}'}async function runTool(){let name=$('toolSelect').value;let args;try{args=JSON.parse($('toolArgs').value||'{}')}catch(e){return toast('参数不是合法 JSON')}$('toolResult').textContent='调用中…';try{let out=await api('/api/tools/call',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,arguments:args})});$('toolResult').textContent=JSON.stringify(out,null,2)}catch(e){$('toolResult').textContent='请求失败：'+e.message}}async function load(){try{plugins=await api('/api/plugins');tools=await api('/api/tools');let a=await api('/api/accounts');$('platformCount').textContent=plugins.length;$('accountCount').textContent=a.length;$('toolCount').textContent=tools.length;$('toolSelect').innerHTML=tools.sort((x,y)=>x.name.localeCompare(y.name)).map(t=>`<option value="${t.name}">${t.name}</option>`).join('');toolChanged();$('pluginList').innerHTML=plugins.map(p=>{let c=p.id==='xiaohongshu'?'xhs':p.id==='wechat'?'wx':'bili';return `<div class="card"><div class="plugin-head"><div class="acct"><div class="icon ${c}">${p.name.slice(0,1)}</div><div><div class="plugin-name">${p.name}</div><div class="muted">v${p.version}</div></div></div><span class="tag ${p.enabled?'':'off'}">${p.enabled?'已启用':'已停用'}</span></div><div class="plugin-meta">${p.tool_count} 个 MCP 工具 · ${p.requires_browser?'浏览器会话':'官方 API'}</div></div>`}).join('');$('accountList').innerHTML=a.length?a.map(x=>`<div class="row"><div class="acct"><div class="avatar">${x.account_id.slice(0,1).toUpperCase()}</div><div><div class="plugin-name">${x.label||x.account_id}</div><div class="muted">${(plugins.find(p=>p.id===x.plugin_id)||{}).name||x.plugin_id} · ${x.account_id}</div></div></div><div class="actions">${(plugins.find(p=>p.id===x.plugin_id)||{}).requires_browser?`<button class="button ghost" onclick="login('${x.plugin_id}','${x.account_id}')">打开登录</button>`:''}<button class="button danger" onclick="removeAccount('${x.plugin_id}','${x.account_id}')">删除</button></div></div>`).join(''):'<div class="empty">还没有账号。添加一个平台账号后，AI 调用时可通过 <code>_account_id</code> 选择它。</div>'}catch(e){toast('加载失败：'+e.message)}}async function saveAccount(){let plugin_id=$('plugin').value,account_id=$('account').value.trim();if(!account_id)return toast('请填写账号标识');let secrets={};if(plugin_id==='wechat'){secrets={app_id:$('app_id').value.trim(),app_secret:$('app_secret').value.trim()};if(!secrets.app_id||!secrets.app_secret)return toast('请填写 AppID 和 AppSecret')}if(plugin_id==='bilibili')secrets.cookie=$('cookie').value.trim();try{await api('/api/accounts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plugin_id,account_id,label:account_id,secrets})});closeModal();toast('账号已保存');load()}catch(e){toast('保存失败：'+e.message)}}async function removeAccount(p,a){if(!confirm('确定删除这个账号吗？'))return;await api('/api/accounts?plugin_id='+encodeURIComponent(p)+'&account_id='+encodeURIComponent(a),{method:'DELETE'});toast('账号已删除');load()}async function login(p,a){try{let out=await api('/api/accounts/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({plugin_id:p,account_id:a})});if(out.login_url)window.open(out.login_url,'_blank');toast(out.message||'浏览器已打开，请完成登录')}catch(e){toast('打开失败：'+e.message)}}load();
</script></body></html>
