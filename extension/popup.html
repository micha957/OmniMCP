<!doctype html><meta charset="utf-8"><title>OmniMCP</title>
<style>
body{width:330px;margin:0;padding:18px;background:#0d1425;color:#eaf0ff;font:13px system-ui}h2{margin:0 0 16px;font-size:18px}label{display:grid;gap:6px;margin:10px 0;color:#9eacc8}input,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #334361;border-radius:7px;background:#111b30;color:#fff}button{border:0;border-radius:7px;padding:9px 12px;background:#6c8fff;color:#fff;font-weight:600;cursor:pointer;margin:10px 6px 0 0}.secondary{background:#253453}.status{margin:12px 0;padding:9px;border-radius:7px;background:#17233c;color:#aebddd}.ok{color:#72e5a8}.error{color:#ff9caa}.hint{font-size:11px;color:#7f8da8;margin-top:12px}
</style><h2>◈ OmniMCP</h2><div class="status" id="status">检查连接中…</div><label>服务器地址<input id="server" placeholder="http://127.0.0.1:8090"></label><label>API Token<input id="token" type="password"></label><label>平台<select id="pluginId"><option value="browser">通用浏览器</option><option value="xiaohongshu">小红书</option><option value="bilibili">哔哩哔哩</option><option value="wechat">微信公众号</option></select></label><label>账号标识<input id="accountId" placeholder="main"></label><button id="save">保存并连接</button><button class="secondary" id="login">打开平台登录</button><div class="hint">登录态保留在当前 Chrome 用户环境中，Cookie 不会复制到服务端。</div><script src="popup.js"></script>
