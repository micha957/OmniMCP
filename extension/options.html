<!doctype html><meta charset="utf-8"><title>OmniMCP 设置</title>
<style>body{font:14px system-ui;max-width:560px;margin:40px auto;padding:0 20px}label{display:grid;gap:6px;margin:18px 0}input{padding:9px;border:1px solid #bbb;border-radius:6px}button{padding:9px 14px}</style>
<h1>OmniMCP 浏览器连接</h1>
<label>服务器地址<input id="server" placeholder="http://127.0.0.1:8090"></label>
<label>API Token（可选）<input id="token" type="password"></label>
<label>平台 ID<input id="pluginId" placeholder="browser / xiaohongshu"></label>
<label>账号 ID<input id="accountId" placeholder="default"></label>
<button id="save">保存</button> <span id="status"></span>
<script>const ids=['server','token','pluginId','accountId'];chrome.storage.local.get({server:'http://127.0.0.1:8090',token:'',pluginId:'',accountId:'default'},v=>ids.forEach(id=>document.getElementById(id).value=v[id]||''));document.getElementById('save').onclick=async()=>{let v=Object.fromEntries(ids.map(id=>[id,document.getElementById(id).value.trim()]));await chrome.storage.local.set(v);document.getElementById('status').textContent='已保存';setTimeout(()=>document.getElementById('status').textContent='',1500)}</script>
